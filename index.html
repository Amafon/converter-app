<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
    <title>Converter App - V1</title>
  </head>
  <body>
    <main>
      <div class="container">
        <div class="heading">
          <h1 class="primary-heading">Metric/Imperial Unit Conversion</h1>
          <div class="input-container">
            <input type="text" name="" id="input-el" />
            <button id="btn-el">Convert</button>
          </div>
        </div>
        <div class="content">
          <div class="card">
            <h3 class="tertiary-heading">Length (Meter/Feet)</h3>
            <p id="length-conversion">
              20 meters = 65.616 feet | 20 feet = 6.096 meters
            </p>
          </div>
          <div class="card">
            <h3>Volume (Liters/Gallons)</h3>
            <p id="volume-conversion">
              20 liters = 5.284 gallons | 20 gallons = 75.708 liters
            </p>
          </div>
          <div class="card">
            <h3>Length (Meter/Feet)</h3>
            <p id="mass-conversion">
              20 kilos = 44.092 pounds | 20 pounds = 9.072 kilos
            </p>
          </div>
        </div>
      </div>
    </main>
    <script src="index.js"></script>
  </body>
</html>
